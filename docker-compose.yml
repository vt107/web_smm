x-app: &app
  build: ./docker/php
  image: smm-panel-php
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      # Nhiều worker để request trong app gọi ngược vào chính app (provider giả lập) không bị treo.
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "${APP_PORT:-8000}:8000"

  queue:
    <<: *app
    command: php artisan queue:work --sleep=1 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-smm}"
      MYSQL_USER: "${DB_USERNAME:-smm}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # Chỉ mở cho máy local (không cho máy khác trong mạng LAN truy cập DB dev)
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
